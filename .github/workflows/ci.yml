name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVER_MIN: "95"

jobs:
  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private module resolution
        run: |
          go env -w GOPROXY=direct
          go env -w GOPRIVATE=github.com/prairie-server/*
          go env -w GONOSUMDB=github.com/prairie-server/*

      - name: golangci-lint
        env:
          GOWORK: off
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          only-new-issues: true
          args: --timeout=5m

  test:
    name: Go tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private module resolution
        run: |
          go env -w GOPROXY=direct
          go env -w GOPRIVATE=github.com/prairie-server/*
          go env -w GONOSUMDB=github.com/prairie-server/*

      - name: Reject committed local SDK replaces
        run: |
          if grep -Eq '^replace github.com/prairie-server/prairie-plugin-sdk => /' go.mod; then
            echo "go.mod contains a machine-local prairie-plugin-sdk replace."
            exit 1
          fi

      - name: Run tests with coverage
        env:
          GOWORK: off
        run: |
          go test ./... -count=1 -covermode=atomic -coverprofile=coverage.out
          test -s coverage.out

      - name: Check the manifest
        env:
          GOWORK: off
        run: |
          plugin_id="$(go run . manifest | jq -r .pluginId)"
          if [ "$plugin_id" != "prairie.auth.ldap" ]; then
            echo "plugin ID is ${plugin_id}, want prairie.auth.ldap"
            exit 1
          fi

      - name: Enforce coverage floor
        run: ./scripts/check-coverage.sh coverage.out

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-out
          path: coverage.out
          if-no-files-found: ignore

  directories:
    name: Directory containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private module resolution
        run: |
          go env -w GOPROXY=direct
          go env -w GOPRIVATE=github.com/prairie-server/*
          go env -w GONOSUMDB=github.com/prairie-server/*

      - name: Start lldap and OpenLDAP
        run: |
          env_file="$(scripts/directory-containers.sh up)"
          # The passwords are generated for this run; keep them out of the log anyway.
          grep '_PASSWORD=' "$env_file" | cut -d= -f2- | sed 's/^/::add-mask::/'
          cat "$env_file" >> "$GITHUB_ENV"

      - name: Run the directory tests
        env:
          GOWORK: off
        run: go test -count=1 -run TestContainerDirectories -v ./ldapauth/

      - name: Show directory logs
        if: failure()
        run: |
          docker logs ldaptest-lldap 2>&1 | tail -100
          docker logs ldaptest-openldap 2>&1 | tail -100

      - name: Remove the containers
        if: always()
        run: scripts/directory-containers.sh down
